model:
    input_dim: 6
    output_dim: 1
    hidden_dim: [32, 16]
    grid_size: 6
    is_first: True
    add_bias: True
    norm_freq: True

train:
    batch_size: 8
    criterion:
        name: 'huber_loss'
        kwargs:
            delta: 0.25
            reduction: 'mean'

    optimizer:
        name: 'adam'
        kwargs:
            lr: 0.0003
            eps: 0.00000001
            weight_decay: 0.0
    scheduler:
        name: 'exponential_lr'
        kwargs:
            gamma: 0.98
    callbacks:
        - name: 'early_stopping'
          kwargs:
              monitor: 'val_loss'
              mode: 'min'
              patience: 5
              min_delta: 0.001
    num_epochs: 200
    start_epoch: 0
    logging_dir: 'log'
    logging_steps: 100
    progress_bar: True
    save_best: True
    save_ckpt: True
    save_fig: True
    num_workers: 8
    pin_memory: True
